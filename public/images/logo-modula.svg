<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" fill="none">
  <!-- Background -->
  <rect width="520" height="130" fill="white"/>
  
  <!-- Geometric glass shapes - top left -->
  <rect x="8" y="6" width="45" height="36" rx="2" stroke="#A7A9AC" stroke-width="2.5" fill="none"/>
  <rect x="28" y="20" width="45" height="36" rx="2" stroke="#1B9E3E" stroke-width="2.5" fill="none"/>
  
  <!-- Stylized M -->
  <g transform="translate(38, 42)">
    <rect x="0" y="0" width="36" height="36" rx="4" stroke="#A7A9AC" stroke-width="2.5" fill="white"/>
    <path d="M8 26 L14 8 L18 20 L22 8 L28 26" stroke="#1B9E3E" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- MODULA text -->
  <text x="95" y="54" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" letter-spacing="1">
    <tspan fill="#1B9E3E">M</tspan><tspan fill="#231F20">ODULA</tspan>
  </text>
  
  <!-- APP text -->
  <text x="95" y="100" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="bold" letter-spacing="2">
    <tspan fill="#1B9E3E">A</tspan><tspan fill="#231F20">PP</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="200" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#6D6E71" letter-spacing="0.5">
    A natureza cria nós transformamos
  </text>
</svg>
